version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9 # Use your Lambda runtime
  build:
    commands:
      - echo "Running tests..."
      # Add your test commands here, e.g., pytest
      - echo "Packaging Lambda function..."
      # This assumes your code is in a 'src' folder
      - zip -r function.zip src/
      - aws cloudformation package --template-file template.yml --s3-bucket $ARTIFACT_BUCKET --output-template-file packaged-template.yml
artifacts:
  files:
    - packaged-template.yml
    - function.zip