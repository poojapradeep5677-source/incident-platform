AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: My Serverless Data Processing App

Resources:
  MyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: my-data-processor
      Handler: src/lambda_function.lambda_handler # Update path
      Runtime: python3.9
      CodeUri: function.zip # This is the file from buildspec.yml
      MemorySize: 128
      Timeout: 30
      Policies:
        - AmazonS3ReadOnlyAccess # Add necessary permissions